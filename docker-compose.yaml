services:
  app:
    container_name: app_economizae
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
        - ./economizae/.env
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: postgres
      SERVER_DATABASE_HOST: postgres_economizae
      APP_NAME: pj-hans-back
      APP_PORT: 8000
      DB_URL: postgresql://admin:pass@postgres_economizae:5432/postgres
      PRIMARY_ADMIN_USERNAME: ${PRIMARY_ADMIN_USERNAME:-admin}
      PRIMARY_ADMIN_EMAIL: ${PRIMARY_ADMIN_EMAIL:-admin@admin.com}
      PRIMARY_ADMIN_PASSWORD: ${PRIMARY_ADMIN_PASSWORD:-12345678}
    ports:
      - "8000:8000"
    networks:
      mynetwork:
        ipv4_address: ${HANS_DOCKER_SUBNET:-192.168.53}.5
    depends_on:
      postgres:
        condition: service_healthy

  migrate:
    container_name: migrate_economizae
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: postgres
      SERVER_DATABASE_HOST: postgres_economizae
      DB_URL: postgresql://admin:pass@postgres_economizae:5432/postgres
      PRIMARY_ADMIN_USERNAME: ${PRIMARY_ADMIN_USERNAME:-admin}
      PRIMARY_ADMIN_EMAIL: ${PRIMARY_ADMIN_EMAIL:-admin@admin.com}
      PRIMARY_ADMIN_PASSWORD: ${PRIMARY_ADMIN_PASSWORD:-12345678}
    command: >
      sh -c "
      aerich upgrade || exit 1 &&
      python scripts/seed_primary_admin.py
      "
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      mynetwork:
        ipv4_address: ${HANS_DOCKER_SUBNET:-192.168.53}.4

  postgres:
    container_name: postgres_economizae
    image: postgres:latest
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: postgres
      PGDATA: /data/postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5445:5432"
    volumes:
      - postgres-db:/data/postgres
    networks:
      mynetwork:
        ipv4_address: ${HANS_DOCKER_SUBNET:-192.168.53}.3

networks:
  mynetwork:
    driver: bridge
    ipam:
      config:
        - subnet: ${HANS_DOCKER_SUBNET:-192.168.53}.0/24

volumes:
  postgres-db:
    driver: local