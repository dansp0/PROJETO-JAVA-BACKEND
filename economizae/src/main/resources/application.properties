spring.application.name=economizae


# ===================================================================
# OPENAI CHAT CONFIGURATION
# ===================================================================
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.chat.options.response-format.type=TEXT

# ===================================================================
# OPENAI AUDIO CONFIGURATION
# ===================================================================
spring.ai.model.audio.transcription=openai
spring.ai.openai.audio.transcription.options.model=whisper-1
spring.ai.openai.audio.transcription.options.language=pt
spring.ai.openai.audio.transcription.options.temperature=0
spring.ai.openai.audio.transcription.options.response-format=text
spring.ai.openai.audio.transcription.options.prompt=Áudio em português brasileiro. \
    Áudio contém descrição de gastos financeiros. \
    As frases geralmente contém: \
     - um valor em reais (número) + "reais"; \
     - uma ação (gastei, paguei, comprei); \
     - um local ou estabelecimento (mercado, farmácia, restaurante, loja, etc.).

# ===================================================================
# SERVER CONFIGURATION
# ===================================================================
server.port=${APP_PORT:9001}
logging.level.io.github.cdimascio=DEBUG

# ===================================================================
# DATASOURCE (POSTGRESQL) CONFIGURATION
# ===================================================================
# Automatically falls back to the docker-compose values if env vars are missing
spring.datasource.url=jdbc:postgresql://${SERVER_DATABASE_HOST:postgres_economizae}:5445/${POSTGRES_DB:postgres}
spring.datasource.username=${POSTGRES_USER:admin}
spring.datasource.password=${POSTGRES_PASSWORD:pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# JPA / HIBERNATE CONFIGURATION
# ===================================================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Since you are using Flyway, Hibernate should just validate the schema, not alter it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===================================================================
# FLYWAY MIGRATION CONFIGURATION
# ===================================================================
spring.flyway.enabled=true
# Optional: Ensure Flyway uses the exact same credentials
spring.flyway.user=${spring.datasource.username}
spring.flyway.password=${spring.datasource.password}

# ===================================================================
# CUSTOM APPLICATION PROPERTIES (From your docker-compose environment)
# ===================================================================
app.name=${APP_NAME:pj-hans-back}
app.admin.username=${PRIMARY_ADMIN_USERNAME:admin}
app.admin.email=${PRIMARY_ADMIN_EMAIL:admin@admin.com}
app.admin.password=${PRIMARY_ADMIN_PASSWORD:12345678}